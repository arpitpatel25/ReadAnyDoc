site_name: ReadAnyDoc docs
site_url: https://arpitpatel25.github.io/ReadAnyDoc/docs/
site_description: Documentation for ReadAnyDoc, the open-source alternative to Reducto.
repo_url: https://github.com/arpitpatel25/ReadAnyDoc
repo_name: arpitpatel25/ReadAnyDoc
edit_uri: edit/main/docs/
copyright: ReadAnyDoc, built by Unmute. Apache-2.0.
docs_dir: docs
site_dir: build/docs

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Geist
    code: Geist Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra:
  homepage: https://arpitpatel25.github.io/ReadAnyDoc/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arpitpatel25/ReadAnyDoc
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/readanydoc/
    - icon: fontawesome/solid/comments
      link: https://github.com/arpitpatel25/ReadAnyDoc/discussions
      name: Community discussions

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

exclude_docs: |
  overrides/

not_in_nav: |
  /research/README.md

nav:
  - Documentation:
    - Get started:
      - Overview: index.md
      - Quickstart (Python): get-started/quickstart.md
      - Quickstart (server): get-started/server-quickstart.md
      - Set up with your coding agent: get-started/agent-setup.md
      - Use from Claude and Cursor (MCP): get-started/mcp.md
      - Guide for coding agents: get-started/agents.md
    - Concepts:
      - How it works: concepts/how-it-works.md
      - The whole product, end to end: concepts/product.md
      - Modes, engine and model only: concepts/modes.md
      - Choosing models: concepts/models.md
      - Citations and confidence: concepts/citations.md
    - Core functions:
      - Parse: guides/parse.md
      - Extract: guides/extract.md
      - Split: guides/split.md
      - Classify: guides/classify.md
      - Edit: guides/edit.md
      - Async jobs and webhooks: guides/jobs-webhooks.md
      - File types: guides/file-types.md
      - Test it yourself: guides/testing.md
      - LangChain, LlamaIndex and Haystack: guides/integrations.md
  - Use cases:
    - Overview: use-cases/index.md
    - Real documents, end to end: examples/real-documents.md
    - Invoices: use-cases/invoices.md
    - Bank statements: use-cases/bank-statements.md
    - Receipts: use-cases/receipts.md
    - Tax forms: use-cases/tax-forms.md
    - Tables from PDFs: use-cases/tables-from-pdf.md
    - PDF to Markdown for RAG: use-cases/pdf-to-markdown.md
    - Scanned documents and handwriting: use-cases/scanned-documents.md
    - Contracts: use-cases/contracts.md
  - Migrate from Reducto:
    - Reducto alternatives compared: compare/alternatives.md
    - Switch in one URL: migrate/from-reducto.md
    - Compatibility, route by route: migrate/compatibility.md
    - Differences and limits: migrate/differences.md
  - Deploy:
    - Docker: deploy/docker.md
    - Configuration: deploy/configuration.md
    - Security: deploy/security.md
    - Performance and scaling: deploy/performance.md
  - API reference:
    - Python library: reference/python.md
    - HTTP API: reference/http.md
    - Command line: reference/cli.md
    - Model specs: reference/model-specs.md
    - Errors: reference/errors.md
  - Resources:
    - Benchmarks: resources/benchmarks.md
    - How we built it:
      - The whole story: story.md
      - "Parser research record": research/journey.md
      - "Extraction research record": research/extraction.md
    - Design decisions: decisions.md
    - FAQ and troubleshooting: resources/faq.md
    - Changelog: resources/changelog.md
    - Community and support: resources/community.md
    - Privacy: resources/privacy.md
    - Contributing: resources/contributing.md
