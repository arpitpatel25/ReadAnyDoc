name: release

# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing:
# no token is stored; PyPI trusts this workflow (project readanydoc, environment "pypi").
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/readanydoc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a re-run (workflow_dispatch) finishes the later steps

  # Lists the new version in the official MCP Registry (registry.modelcontextprotocol.io), which MCP clients and
  # directories read. GitHub OIDC proves the io.github.arpitpatel25 namespace; no token is stored.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for the PyPI release to be visible
        run: |
          v=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do curl -fs "https://pypi.org/pypi/readanydoc/$v/json" >/dev/null && break; sleep 10; done
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
